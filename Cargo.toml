[package]
name = "row"
version = "0.4.0"
edition = "2021"
rust-version = "1.81"
description = "Row is a command line tool that helps you manage workflows on HPC resources."
homepage = "https://glotzerlab.engin.umich.edu"
documentation = "https://row.readthedocs.io"
readme = "README.md"
repository = "https://github.com/glotzerlab/row"
license = "BSD-3-Clause"
keywords = ["workflow", "slurm", "queue", "hpc", "cluster"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5.27", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.2"
clap_complete = { version = "4.5.44", features = ["unstable-dynamic"] }
console = "0.15.10"
env_logger = "0.11.6"
home = "0.5.11"
human_format = "1.1.0"
indicatif = "0.17.11"
indicatif-log-bridge = "0.2.3"
log = "0.4.25"
memchr = "2.7.4"
nix = { version = "0.29.0", features = ["signal"] }
path-absolutize = "3.1.1"
postcard = { version = "1.1.1", default-features = false, features = ["use-std"] }
regex = "1.11.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
shell-quote = { version = "0.7.2", default-features = false, features = ["bash"] }
signal-hook = { version = "0.3.17", default-features = false }
speedate = "0.15.0"
thiserror = "2.0.11"
toml = "0.8.19"
uuid = { version = "1.12.1", features = ["v4"] }
wildmatch = "2.4.0"

[dev-dependencies]
assert_cmd = "2.0.15"
assert_fs = "1.1.2"
predicates = { version = "3.1.3", features = ["regex"] }
serial_test = "3.2.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
format_push_string = "warn"
