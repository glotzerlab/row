[package]
name = "row"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
description = "Row is a command line tool that helps you manage workflows on HPC resources."
homepage = "https://glotzerlab.engin.umich.edu"
documentation = "https://row.readthedocs.io"
readme = "README.md"
repository = "https://github.com/glotzerlab/row"
license = "BSD-3-Clause"
keywords = ["workflow", "slurm", "queue", "hpc", "cluster"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5.43", features = ["derive", "env"] }
clap-verbosity-flag = "3.0.3"
clap_complete = { version = "4.5.55", features = ["unstable-dynamic"] }
console = "0.16.0"
env_logger = "0.11.6"
human_format = "1.1.0"
indicatif = "0.18.0"
indicatif-log-bridge = "0.2.3"
log = "0.4.27"
memchr = "2.7.5"
nix = { version = "0.30.1", features = ["signal"] }
path-absolutize = "3.1.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
shell-quote = { version = "0.7.2", default-features = false, features = ["bash"] }
signal-hook = { version = "0.3.18", default-features = false }
speedate = "0.17.0"
thiserror = "2.0.12"
toml = "0.9.5"
uuid = { version = "1.17.0", features = ["v4"] }
wildmatch = "2.4.0"

[dev-dependencies]
assert_cmd = "2.0.16"
assert_fs = "1.1.3"
predicates = { version = "3.1.3", features = ["regex"] }
serial_test = "3.2.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
format_push_string = "warn"
