ci:
  autoupdate_schedule: quarterly
  autoupdate_branch: 'trunk'
  autofix_prs: false
  # rust does not work on pre-commit.ci
  skip: [fmt, check, clippy]

repos:
- repo: https://github.com/glotzerlab/pre-commit-rust-hooks
  rev: 766490b4a83f979ad61bf6ee6fb03ba394fe4170
  hooks:
  - id: fmt
  - id: check
  - id: clippy
    args:
      - --all-targets
      - --all-features
      - --
      - -Dwarnings
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 'v5.0.0'
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-json
  - id: check-toml
  - id: check-yaml
  - id: check-case-conflict
  - id: mixed-line-ending
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
    - id: actionlint
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 'v0.12.2'
  hooks:
  - id: ruff-format
  - id: ruff
- repo: https://github.com/glotzerlab/fix-license-header
  rev: v0.4.1
  hooks:
  - id: fix-license-header
    name: Fix license headers
    types_or: [rust]
    args:
    - --license-file=LICENSE
    - --add=Part of row, released under the BSD 3-Clause License.
